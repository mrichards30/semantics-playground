<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- maths and code: never machine-translate (Chrome misdetects the language) -->
<meta name="google" content="notranslate">
<title>semantics playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>semantics playground</h1>
  <nav class="pages">
    <button id="page-language" class="page-tab on" type="button">language</button>
    <button id="page-run" class="page-tab" type="button">run</button>
  </nav>
  <label class="example">example
    <select id="example"></select>
  </label>
</header>

<main>
  <section id="language">
    <div class="bar subtabs">
      <button id="tab-rules" class="tab on" type="button">rules</button>
      <button id="tab-text" class="tab" type="button">text</button>
      <span id="problems" class="status"></span>
      <span id="load-status" class="status"></span>
    </div>
    <div id="cards"></div>
    <div id="text-view" hidden>
      <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
      <ul id="text-problems" class="problems"></ul>
    </div>
  </section>

  <section id="machine" hidden>
    <div class="bar relation-bar">
      <label class="relation-pick">relation <select id="relation"></select></label>
      <span id="lang-banner" class="status"></span>
    </div>
    <h2>Program</h2>
    <div id="program" class="program-editor"></div>
    <div class="bar">
      <button id="start">start</button>
      <span id="program-status" class="status"></span>
    </div>

    <div id="session" hidden>
      <div class="bar controls">
        <button id="reset" title="back to the start">reset</button>
        <span id="step-count" class="meta"></span>
        <span id="machine-status" class="status"></span>
      </div>
      <div id="focus" class="focus" tabindex="0"></div>
    </div>

    <div id="query" hidden>
      <h2>Solutions <span id="query-meta" class="meta"></span></h2>
      <ol id="solutions" class="solutions"></ol>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="vendor/codemirror.js"></script>
<script src="semplay_js.bc.js"></script>
<script src="typeset.js"></script>
<script src="editor.js"></script>
<script src="examples.js"></script>
<script src="app.js"></script>
</body>
</html>
